<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="fuenteLink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <style>
    /* ============================================================
       NEXO — Tienda online por cliente (plantilla "moderna", diseño base de Mariano)
       Colores, letra, textos y reglas salen de la configuración de cada cliente.
       ============================================================ */
    :root {
      --t-primario: #0A317B;
      --t-oscuro: #061F50;
      --t-acento: #FFC700;
      --t-acento-hover: #E5B300;
      --t-primario-txt: #FFFFFF;
      --t-acento-txt: #061F50;
      --bg-body: #F4F6F9;
      --card-bg: #FFFFFF;
      --text-dark: #0D1B2A;
      --text-muted: #6C757D;
      --borde: #E2E8F0;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(10, 49, 123, 0.08);
      --fuente: 'Montserrat', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--fuente); }
    body { background-color: var(--bg-body); color: var(--text-dark); padding-bottom: 110px; min-height: 100vh; }
    button { font-family: var(--fuente); }

    /* Navbar */
    .navbar { position: sticky; top: 0; background: rgba(255,255,255,.98); backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--borde); padding: 12px 20px; display: flex; justify-content: space-between;
      align-items: center; gap: 12px; z-index: 1000; }
    .brand-logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; color: var(--t-primario); display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-logo .ac { color: var(--t-acento); }
    .brand-logo img { max-height: 44px; max-width: 180px; object-fit: contain; }
    .status-badge { font-size: .78rem; font-weight: 700; color: #0F5132; background: #D1E7DD; padding: 6px 12px; border-radius: 20px; white-space: nowrap; }
    .status-badge.cerrado { color: #842029; background: #F8D7DA; }

    /* Hero */
    .hero { background: linear-gradient(135deg, var(--t-primario) 0%, var(--t-oscuro) 100%); color: var(--t-primario-txt);
      text-align: center; padding: 40px 20px 50px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; }
    .hero h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; overflow-wrap: anywhere; }
    .hero p { font-size: .95rem; opacity: .88; font-weight: 500; letter-spacing: .5px; }

    /* Banners informativos */
    .info-features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 900px; margin: -22px auto 24px; padding: 0 16px; }
    .feature-card { background: var(--card-bg); padding: 12px 10px; border-radius: var(--radius); box-shadow: var(--shadow);
      text-align: center; font-size: .8rem; font-weight: 700; color: var(--t-primario); border-bottom: 3px solid var(--t-acento); }
    .sin-features { height: 24px; }

    /* Buscador y categorías */
    .controls-section { max-width: 900px; margin: 0 auto; padding: 0 16px; }
    .search-box { width: 100%; padding: 14px 20px; border: 2px solid var(--borde); border-radius: 30px; font-size: .95rem;
      margin-bottom: 16px; outline: none; background: var(--card-bg); color: var(--text-dark); transition: all .2s; }
    .search-box:focus { border-color: var(--t-primario); box-shadow: 0 0 0 4px rgba(10,49,123,.1); }
    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .category-btn { background: var(--card-bg); border: 1.5px solid #CBD5E1; color: var(--text-dark); padding: 8px 18px; border-radius: 20px;
      white-space: nowrap; font-size: .85rem; font-weight: 700; cursor: pointer; transition: all .2s; }
    .category-btn.active, .category-btn:hover { background: var(--t-primario); color: var(--t-primario-txt); border-color: var(--t-primario); }

    /* Grilla */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; max-width: 900px; margin: 20px auto; padding: 0 16px; }
    @media (min-width: 600px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; } }
    .product-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex;
      flex-direction: column; border: 1px solid var(--borde); transition: transform .2s, box-shadow .2s; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(10,49,123,.15); }
    .product-img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; cursor: zoom-in; display: block; }
    .product-img.sin-foto { display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: #CBD5E1; background: #F1F5F9; }
    .product-details { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; }
    .product-title { font-size: .9rem; font-weight: 700; margin-bottom: 6px; color: var(--text-dark); line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .product-price { font-size: 1.15rem; font-weight: 800; color: var(--t-primario); margin-bottom: 12px; }
    .qty-controls { margin-top: auto; display: flex; align-items: center; justify-content: space-between; background: #F8FAFC;
      border-radius: 10px; padding: 4px; border: 1px solid var(--borde); }
    .qty-btn { width: 32px; height: 32px; border: none; background: #fff; border-radius: 8px; font-weight: 800; font-size: 1.1rem;
      cursor: pointer; color: var(--t-primario); box-shadow: 0 1px 3px rgba(0,0,0,.1); transition: background .15s; }
    .qty-btn:hover { background: var(--t-acento); color: var(--t-acento-txt); }
    .qty-btn:disabled { opacity: .4; cursor: not-allowed; }
    .qty-count { font-weight: 700; font-size: .95rem; min-width: 24px; text-align: center; color: var(--text-dark); }
    .vacio { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px 10px; font-weight: 600; }

    /* Barra flotante */
    .floating-cart-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 480px;
      background: var(--t-acento); color: var(--t-acento-txt); padding: 14px 24px; border-radius: 50px; display: flex; justify-content: space-between;
      align-items: center; box-shadow: 0 10px 30px rgba(10,49,123,.3); cursor: pointer; z-index: 999; font-weight: 800; transition: transform .2s, filter .2s; border: none; font-size: 1rem; }
    .floating-cart-bar:hover { filter: brightness(.95); transform: translateX(-50%) scale(1.02); }
    .cart-info { display: flex; align-items: center; gap: 12px; }
    .cart-badge { background: var(--t-primario); color: var(--t-primario-txt); padding: 4px 12px; border-radius: 20px; font-size: .8rem; font-weight: 700; }
    .cart-total { font-size: 1.2rem; font-weight: 800; }

    /* Panel de pedido y ficha de producto */
    .capa { position: fixed; inset: 0; background: rgba(6,20,50,.55); display: none; align-items: flex-end; justify-content: center; z-index: 2000; }
    .capa.show { display: flex; }
    @media (min-width: 700px) { .capa { align-items: center; } }
    .panel { background: var(--card-bg); color: var(--text-dark); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
      border-radius: 20px 20px 0 0; padding: 22px 20px 26px; position: relative; }
    @media (min-width: 700px) { .panel { border-radius: 20px; } }
    .panel h2 { font-size: 1.15rem; font-weight: 800; color: var(--t-primario); margin-bottom: 14px; padding-right: 36px; }
    .cerrar { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: none; background: #F1F5F9;
      font-size: 1rem; cursor: pointer; color: var(--text-dark); }
    .item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--borde); }
    .item img, .item .mini { width: 46px; height: 46px; border-radius: 8px; object-fit: contain; background: #fff; flex: none; border: 1px solid var(--borde); }
    .item .mini { display: flex; align-items: center; justify-content: center; color: #CBD5E1; }
    .item .nom { flex: 1; font-size: .85rem; font-weight: 600; min-width: 0; }
    .item .sub { font-size: .75rem; color: var(--text-muted); font-weight: 500; }
    .item .qty-controls { margin: 0; width: 110px; }
    .totales { margin: 14px 0; font-size: .9rem; }
    .totales div { display: flex; justify-content: space-between; padding: 3px 0; }
    .totales .grande { font-size: 1.15rem; font-weight: 800; color: var(--t-primario); border-top: 1px dashed var(--borde); margin-top: 6px; padding-top: 8px; }
    .campo { margin-bottom: 12px; }
    .campo label { display: block; font-size: .8rem; font-weight: 700; margin-bottom: 5px; }
    .campo input, .campo textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--borde); border-radius: 10px; font-size: .9rem; outline: none; background: #fff; color: #0D1B2A; }
    .campo input:focus, .campo textarea:focus { border-color: var(--t-primario); }
    .opciones { display: flex; gap: 8px; flex-wrap: wrap; }
    .opcion { flex: 1; min-width: 120px; border: 1.5px solid var(--borde); border-radius: 10px; padding: 10px 12px; font-size: .85rem; font-weight: 700; cursor: pointer; background: #fff; color: #0D1B2A; text-align: left; }
    .opcion.sel { border-color: var(--t-primario); background: rgba(10,49,123,.06); color: var(--t-primario); }
    .opcion:disabled { opacity: .45; cursor: not-allowed; }
    .nota { font-size: .78rem; color: var(--text-muted); background: #F8FAFC; border-radius: 10px; padding: 8px 10px; margin-top: 8px; font-weight: 500; }
    .error { color: #B42318; font-size: .8rem; font-weight: 600; margin-top: 4px; display: none; }
    .error.show { display: block; }
    .btn-enviar { width: 100%; border: none; border-radius: 14px; padding: 15px; font-size: 1rem; font-weight: 800; cursor: pointer;
      background: #25D366; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; }
    .btn-enviar:disabled { opacity: .5; cursor: not-allowed; }
    .ficha-img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; border-radius: 12px; border: 1px solid var(--borde); }
    .ficha-thumbs { display: flex; gap: 8px; overflow-x: auto; margin: 10px 0; }
    .ficha-thumbs img { width: 56px; height: 56px; object-fit: contain; border-radius: 8px; border: 2px solid var(--borde); cursor: pointer; background: #fff; flex: none; }
    .ficha-thumbs img.sel { border-color: var(--t-primario); }
    .ficha-desc { font-size: .85rem; color: var(--text-muted); line-height: 1.5; white-space: pre-line; margin: 10px 0 14px; }

    footer { text-align: center; padding: 30px 20px; font-size: .85rem; color: var(--text-muted); border-top: 1px solid var(--borde); margin-top: 50px; font-weight: 600; }
    footer a { color: inherit; }
    .aviso-vista { position: relative; background: #1e1b4b; color: #fff; font-size: 12px; text-align: center; padding: 4px; z-index: 3000; }
    .pantalla-msg { max-width: 460px; margin: 18vh auto 0; text-align: center; padding: 20px; color: var(--text-muted); }
    .pantalla-msg h1 { font-size: 1.4rem; color: var(--text-dark); margin-bottom: 8px; }
    .cargando { text-align: center; color: var(--text-muted); padding: 60px 10px; font-weight: 600; }
  </style>
  <style id="cssPersonalizado"></style>
</head>
<body>
  <div id="app"><div class="cargando">Cargando tienda…</div></div>

  <script>
  // ================================================================
  // Datos de conexión (clave pública: la seguridad la dan las reglas de la base)
  // ================================================================
  const SB_URL = "https://piqkwewxbjumyqwtmnxn.supabase.co";
  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpcWt3ZXd4Ymp1bXlxd3RtbnhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NTcxODAsImV4cCI6MjA5NzEzMzE4MH0.bye19z4vBriLwqvswMfhF3P5BJAVa2_Cxzn08Tg091I";
  const FUENTES = ["Montserrat","Poppins","Inter","Nunito","Roboto","Open Sans","Lato","Raleway","Rubik","Quicksand","Playfair Display","Merriweather","Oswald","Work Sans","DM Sans"];

  const params = new URLSearchParams(location.search);
  const SLUG = (params.get("t") || "").trim().toLowerCase();
  const VISTA_PREVIA = params.get("preview") === "1";

  let tienda = null;      // {cliente_id, nombre, logo, config, ...}
  let cfg = {};           // configuración final (con valores por defecto)
  let productos = [];
  let cart = {};
  let filtro = {q:"", rubro:""};
  let pedido = {entrega:"", pago:""};

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function fmt(n){ return "$ " + Math.round(Number(n)||0).toLocaleString("es-AR"); }
  function hexOk(h){ return /^#[0-9a-fA-F]{6}$/.test(h||""); }
  function lum(h){ const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; }
  function contraste(a,b){ const x=lum(a), y=lum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }
  function textoSobre(h){ return contraste(h,"#FFFFFF") >= contraste(h,"#0D1B2A") ? "#FFFFFF" : "#0D1B2A"; }
  function numWa(s){ return String(s||"").replace(/\D/g,""); }
  function img(u){ return String(u||"").replace(/^http:\/\//,"https://"); }

  // Valores por defecto (se pisan con la configuración del cliente)
  function configPorDefecto(t){
    return {
      marca_texto: t.nombre || "", marca_acento: "", usar_logo: !!t.logo,
      titulo: t.nombre || "", eslogan: "Todo lo que necesitás, en un solo lugar",
      colores: {primario: t.color_primario || "#0A317B", oscuro: t.color_oscuro || "#061F50", acento: t.color_acento || "#FFC700", fondo: "#F4F6F9"},
      fuente: "Montserrat",
      pedidos_abiertos: true, texto_abierto: "🟢 Pedidos abiertos", texto_cerrado: "🔴 Pedidos cerrados",
      features: ["🚚 Envíos a domicilio", "💳 Medios de pago", "📲 Pedido directo"],
      mostrar_features: true, mostrar_buscador: true, mostrar_categorias: true,
      whatsapp: "", pide_email: true, pide_telefono: false,
      entrega_envio: true, entrega_retiro: true, direccion_retiro: "",
      pagos: ["Transferencia", "Efectivo"], descuento_efectivo: 0, envio_gratis_desde: 0, envio_solo_transferencia: false,
      nota_envio: "", pie: "© " + (t.nombre || "")
    };
  }
  function combinar(base, extra){
    const out = Object.assign({}, base, extra || {});
    out.colores = Object.assign({}, base.colores, (extra && extra.colores) || {});
    return out;
  }

  // ================================================================
  // Carga
  // ================================================================
  function sesionPanel(){
    try{ const s = JSON.parse(localStorage.getItem("nexo_sesion") || "null"); return s && s.access_token ? s : null; }catch(e){ return null; }
  }
  async function sb(path, opts){
    const h = Object.assign({"apikey":SB_KEY, "Content-Type":"application/json"}, (opts && opts.headers) || {});
    const s = VISTA_PREVIA ? sesionPanel() : null;
    h["Authorization"] = "Bearer " + (s ? s.access_token : SB_KEY);
    return fetch(SB_URL + path, Object.assign({}, opts || {}, {headers: h}));
  }
  async function cargarTienda(){
    // Vista previa desde el panel: lee la tienda del cliente activo con la sesión del panel (aunque no esté publicada)
    if(VISTA_PREVIA && sesionPanel()){
      const [rc, rt] = await Promise.all([
        sb("/rest/v1/nexo_clientes?select=id,slug,nombre,logo,color_primario,color_oscuro,color_acento&slug=eq."+encodeURIComponent(SLUG)),
        sb("/rest/v1/nexo_tiendas?select=*")
      ]);
      const c = rc.ok ? (await rc.json())[0] : null;
      const t = rt.ok ? (await rt.json())[0] : null;
      if(!c) return null;
      return {cliente_id:c.id, slug:c.slug, nombre:c.nombre, logo:c.logo, color_primario:c.color_primario, color_oscuro:c.color_oscuro, color_acento:c.color_acento,
        plantilla:(t&&t.plantilla)||"moderna", config:(t&&t.config)||{}, css:(t&&t.css_personalizado)||"", html_arriba:(t&&t.html_arriba)||"", html_abajo:(t&&t.html_abajo)||""};
    }
    if(!SLUG) return null;
    const r = await sb("/rest/v1/rpc/nexo_tienda_publica", {method:"POST", body: JSON.stringify({p_slug: SLUG})});
    if(!r.ok) throw new Error("No se pudo cargar la tienda ("+r.status+")");
    return await r.json();
  }
  async function cargarProductos(){
    const r = await sb("/rest/v1/productos?select=sku,nombre,precio,stockOn,rubro,img,imagenes,descripcion&cliente_id=eq."+tienda.cliente_id+"&order=nombre.asc");
    if(!r.ok) throw new Error("No se pudieron cargar los productos ("+r.status+")");
    const d = await r.json();
    productos = (d||[]).filter(p => p.stockOn !== 0 && p.stockOn !== "0" && Number(p.precio) > 0);
  }
  function claveCarrito(){ return "nexo_carrito_" + (SLUG || "x"); }
  function guardarCarrito(){ try{ localStorage.setItem(claveCarrito(), JSON.stringify(cart)); }catch(e){} }
  function leerCarrito(){
    try{ const c = JSON.parse(localStorage.getItem(claveCarrito()) || "{}"); cart = {};
      Object.keys(c).forEach(k=>{ if(productos.some(p=>p.sku===k) && c[k]>0) cart[k] = c[k]; });
    }catch(e){ cart = {}; }
  }

  // ================================================================
  // Estética
  // ================================================================
  function aplicarEstetica(){
    const col = cfg.colores || {};
    const prim = hexOk(col.primario) ? col.primario : "#0A317B";
    const osc = hexOk(col.oscuro) ? col.oscuro : "#061F50";
    const ac = hexOk(col.acento) ? col.acento : "#FFC700";
    const fondo = hexOk(col.fondo) ? col.fondo : "#F4F6F9";
    const r = document.documentElement.style;
    r.setProperty("--t-primario", prim);
    r.setProperty("--t-oscuro", osc);
    r.setProperty("--t-acento", ac);
    r.setProperty("--t-primario-txt", textoSobre(prim));
    r.setProperty("--t-acento-txt", textoSobre(ac));
    r.setProperty("--bg-body", fondo);
    const oscuroFondo = textoSobre(fondo) === "#FFFFFF";
    r.setProperty("--text-dark", oscuroFondo ? "#F1F5F9" : "#0D1B2A");
    r.setProperty("--text-muted", oscuroFondo ? "#CBD5E1" : "#6C757D");
    r.setProperty("--card-bg", oscuroFondo ? "#1E293B" : "#FFFFFF");
    r.setProperty("--borde", oscuroFondo ? "#334155" : "#E2E8F0");
    const fuente = FUENTES.includes(cfg.fuente) ? cfg.fuente : "Montserrat";
    r.setProperty("--fuente", "'" + fuente + "', sans-serif");
    document.getElementById("fuenteLink").href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(fuente).replace(/%20/g,"+") + ":wght@400;500;600;700;800&display=swap";
    document.getElementById("cssPersonalizado").textContent = tienda.css || "";
    document.title = (cfg.titulo || tienda.nombre || "Tienda") + (cfg.eslogan ? " — " + cfg.eslogan : "");
  }

  // ================================================================
  // Pantalla
  // ================================================================
  function rubros(){ return [...new Set(productos.map(p=>(p.rubro||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es")); }
  function logoHtml(){
    if(cfg.usar_logo && tienda.logo) return `<img src="${esc(tienda.logo)}" alt="${esc(tienda.nombre)}">`;
    return `<span class="marca">${esc(cfg.marca_texto)}<span class="ac">${esc(cfg.marca_acento)}</span></span>`;
  }
  function render(){
    const abiertos = cfg.pedidos_abiertos !== false;
    const feats = (cfg.features || []).filter(f=>String(f||"").trim());
    document.getElementById("app").innerHTML = `
      ${VISTA_PREVIA ? '<div class="aviso-vista">Vista previa del panel NEXO · los cambios se ven al instante y no se publican hasta que guardes</div>' : ""}
      <header class="navbar">
        <div class="brand-logo">${logoHtml()}</div>
        <div class="status-badge ${abiertos?"":"cerrado"}">${esc(abiertos ? cfg.texto_abierto : cfg.texto_cerrado)}</div>
      </header>
      <div id="htmlArriba">${tienda.html_arriba || ""}</div>
      <section class="hero">
        <h1>${esc(cfg.titulo)}</h1>
        ${cfg.eslogan ? `<p>${esc(String(cfg.eslogan).toUpperCase())}</p>` : ""}
      </section>
      ${cfg.mostrar_features !== false && feats.length ? `<div class="info-features" style="grid-template-columns:repeat(${Math.min(feats.length,3)},1fr);">${feats.slice(0,3).map(f=>`<div class="feature-card">${esc(f)}</div>`).join("")}</div>` : `<div class="sin-features"></div>`}
      <section class="controls-section">
        ${cfg.mostrar_buscador !== false ? `<input type="search" class="search-box" id="buscador" placeholder="🔍 Buscar producto en el catálogo..." value="${esc(filtro.q)}" oninput="filtro.q=this.value;renderGrilla()">` : ""}
        ${cfg.mostrar_categorias !== false && rubros().length ? `<div class="categories" id="categorias"></div>` : ""}
      </section>
      <main class="product-grid" id="grilla"></main>
      <div id="htmlAbajo">${tienda.html_abajo || ""}</div>
      <button class="floating-cart-bar" id="barraCarrito" onclick="abrirPedido()">
        <div class="cart-info"><span>Ver pedido</span><span class="cart-badge" id="barraItems">0 ítems</span></div>
        <div class="cart-total" id="barraTotal">$ 0</div>
      </button>
      <footer><p>${esc(cfg.pie)}</p></footer>
      <div class="capa" id="capaPedido" onclick="if(event.target===this)cerrarCapa('capaPedido')"><div class="panel" id="panelPedido"></div></div>
      <div class="capa" id="capaFicha" onclick="if(event.target===this)cerrarCapa('capaFicha')"><div class="panel" id="panelFicha"></div></div>`;
    renderCategorias(); renderGrilla(); renderBarra();
  }
  function renderCategorias(){
    const el = document.getElementById("categorias"); if(!el) return;
    el.innerHTML = [""].concat(rubros()).map(r=>`<button class="category-btn ${filtro.rubro===r?"active":""}" onclick="filtro.rubro=${esc(JSON.stringify(r))};renderCategorias();renderGrilla()">${esc(r||"Todos")}</button>`).join("");
  }
  function visibles(){
    const q = filtro.q.trim().toLowerCase();
    return productos.filter(p => (!filtro.rubro || (p.rubro||"").trim()===filtro.rubro) && (!q || (p.nombre+" "+p.sku).toLowerCase().includes(q)));
  }
  function fotoPrincipal(p){ return img(p.img || (Array.isArray(p.imagenes) && p.imagenes[0]) || ""); }
  function renderGrilla(){
    const abiertos = cfg.pedidos_abiertos !== false;
    const lista = visibles();
    document.getElementById("grilla").innerHTML = lista.map(p=>{
      const i = productos.indexOf(p), q = cart[p.sku] || 0, f = fotoPrincipal(p);
      return `<div class="product-card">
        ${f ? `<img src="${esc(f)}" class="product-img" alt="${esc(p.nombre)}" loading="lazy" onclick="abrirFicha(${i})">` : `<div class="product-img sin-foto" onclick="abrirFicha(${i})">🛍️</div>`}
        <div class="product-details">
          <div class="product-title">${esc(p.nombre)}</div>
          <div class="product-price">${fmt(p.precio)}</div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="cambiar(${i},-1)" ${!abiertos||!q?"disabled":""} aria-label="Quitar uno">-</button>
            <span class="qty-count" id="q${i}">${q}</span>
            <button class="qty-btn" onclick="cambiar(${i},1)" ${!abiertos?"disabled":""} aria-label="Agregar uno">+</button>
          </div>
        </div>
      </div>`;
    }).join("") || `<div class="vacio">${productos.length ? "No encontramos productos con esa búsqueda." : "Todavía no hay productos en la tienda."}</div>`;
  }
  function cambiar(i, d){
    if(cfg.pedidos_abiertos === false) return;
    const p = productos[i]; if(!p) return;
    const n = Math.max(0, (cart[p.sku]||0) + d);
    if(n) cart[p.sku] = n; else delete cart[p.sku];
    guardarCarrito(); renderGrilla(); renderBarra();
    if(document.getElementById("capaPedido").classList.contains("show")) renderPedido();
    if(document.getElementById("capaFicha").classList.contains("show")) abrirFicha(i, true);
  }
  function calcular(){
    let subtotal = 0, items = 0;
    Object.keys(cart).forEach(sku=>{ const p = productos.find(x=>x.sku===sku); if(p){ subtotal += p.precio*cart[sku]; items += cart[sku]; } });
    const desc = pedido.pago === "Efectivo" && Number(cfg.descuento_efectivo) > 0 ? subtotal * Number(cfg.descuento_efectivo)/100 : 0;
    return {subtotal, items, desc, total: subtotal - desc};
  }
  function renderBarra(){
    const c = calcular();
    document.getElementById("barraItems").textContent = c.items + (c.items===1 ? " ítem" : " ítems");
    document.getElementById("barraTotal").textContent = fmt(c.total);
  }
  function cerrarCapa(id){ document.getElementById(id).classList.remove("show"); }

  // Ficha de producto con galería
  function abrirFicha(i, mantener){
    const p = productos[i]; if(!p) return;
    const fotos = [...new Set([p.img].concat(Array.isArray(p.imagenes)?p.imagenes:[]).filter(Boolean).map(img))];
    const panel = document.getElementById("panelFicha");
    const actual = mantener && panel.dataset.foto ? panel.dataset.foto : (fotos[0] || "");
    const q = cart[p.sku] || 0, abiertos = cfg.pedidos_abiertos !== false;
    panel.dataset.foto = actual;
    panel.innerHTML = `<button class="cerrar" onclick="cerrarCapa('capaFicha')" aria-label="Cerrar">✕</button>
      <h2>${esc(p.nombre)}</h2>
      ${actual ? `<img class="ficha-img" id="fichaImg" src="${esc(actual)}" alt="${esc(p.nombre)}">` : ""}
      ${fotos.length > 1 ? `<div class="ficha-thumbs">${fotos.map(f=>`<img src="${esc(f)}" class="${f===actual?"sel":""}" onclick="document.getElementById('panelFicha').dataset.foto=this.src;abrirFicha(${i},true)" alt="">`).join("")}</div>` : ""}
      <div class="product-price" style="margin-top:12px;">${fmt(p.precio)}</div>
      ${p.descripcion ? `<div class="ficha-desc">${esc(p.descripcion)}</div>` : ""}
      <div class="qty-controls" style="max-width:220px;">
        <button class="qty-btn" onclick="cambiar(${i},-1)" ${!abiertos||!q?"disabled":""}>-</button>
        <span class="qty-count">${q}</span>
        <button class="qty-btn" onclick="cambiar(${i},1)" ${!abiertos?"disabled":""}>+</button>
      </div>`;
    document.getElementById("capaFicha").classList.add("show");
  }

  // Pedido
  function abrirPedido(){ renderPedido(); document.getElementById("capaPedido").classList.add("show"); }
  function opcionesEntrega(){ const o=[]; if(cfg.entrega_envio!==false) o.push("Envío"); if(cfg.entrega_retiro!==false) o.push("Retiro"); return o; }
  function opcionesPago(){ return (Array.isArray(cfg.pagos) && cfg.pagos.length ? cfg.pagos : ["Transferencia"]); }
  function pagoPermitido(pg){ return !(cfg.envio_solo_transferencia && pedido.entrega === "Envío" && pg !== "Transferencia"); }
  function renderPedido(){
    const ent = opcionesEntrega(); if(ent.length === 1) pedido.entrega = ent[0];
    if(pedido.pago && !pagoPermitido(pedido.pago)) pedido.pago = "";
    const pags = opcionesPago().filter(pagoPermitido); if(pags.length === 1) pedido.pago = pags[0];
    const c = calcular(), abiertos = cfg.pedidos_abiertos !== false;
    const skus = Object.keys(cart);
    const val = id => { const e = document.getElementById(id); return e ? e.value : ""; };
    const datos = {nombre: val("pNombre"), email: val("pEmail"), tel: val("pTel"), dir: val("pDir"), obs: val("pObs")};
    const gratis = Number(cfg.envio_gratis_desde) > 0;
    document.getElementById("panelPedido").innerHTML = `<button class="cerrar" onclick="cerrarCapa('capaPedido')" aria-label="Cerrar">✕</button>
      <h2>🛒 Tu pedido</h2>
      ${skus.length ? skus.map(sku=>{ const p = productos.find(x=>x.sku===sku); if(!p) return ""; const i = productos.indexOf(p), f = fotoPrincipal(p);
        return `<div class="item">${f?`<img src="${esc(f)}" alt="">`:`<div class="mini">🛍️</div>`}
          <div class="nom">${esc(p.nombre)}<div class="sub">${fmt(p.precio)} c/u · ${fmt(p.precio*cart[sku])}</div></div>
          <div class="qty-controls"><button class="qty-btn" onclick="cambiar(${i},-1)">-</button><span class="qty-count">${cart[sku]}</span><button class="qty-btn" onclick="cambiar(${i},1)">+</button></div></div>`; }).join("")
        : `<p class="nota">Todavía no agregaste productos.</p>`}
      <div class="totales">
        <div><span>Subtotal</span><span>${fmt(c.subtotal)}</span></div>
        ${c.desc ? `<div style="color:#15803D;"><span>Descuento efectivo (${Number(cfg.descuento_efectivo)}%)</span><span>- ${fmt(c.desc)}</span></div>` : ""}
        <div class="grande"><span>Total</span><span>${fmt(c.total)}</span></div>
      </div>
      ${!abiertos ? `<p class="nota">En este momento no estamos tomando pedidos.</p>` : `
      <div class="campo"><label for="pNombre">Nombre y apellido *</label><input id="pNombre" autocomplete="name" value="${esc(datos.nombre)}"><div class="error" id="eNombre">Ingresá tu nombre.</div></div>
      ${cfg.pide_email !== false ? `<div class="campo"><label for="pEmail">Email *</label><input id="pEmail" type="email" autocomplete="email" value="${esc(datos.email)}"><div class="error" id="eEmail">Ingresá un email válido.</div></div>` : ""}
      ${cfg.pide_telefono ? `<div class="campo"><label for="pTel">Teléfono *</label><input id="pTel" type="tel" autocomplete="tel" value="${esc(datos.tel)}"><div class="error" id="eTel">Ingresá un teléfono.</div></div>` : ""}
      <div class="campo"><label>Entrega *</label><div class="opciones">
        ${ent.map(o=>`<button type="button" class="opcion ${pedido.entrega===o?"sel":""}" onclick="pedido.entrega='${o}';renderPedido()">${o==="Envío"?"🚚 Envío":"🏬 Retiro en local"}</button>`).join("")}
      </div>
      ${pedido.entrega==="Envío" ? `<div class="campo" style="margin-top:8px;"><input id="pDir" autocomplete="street-address" placeholder="Dirección completa para el envío" value="${esc(datos.dir)}"></div>` : ""}
      ${pedido.entrega==="Retiro" && cfg.direccion_retiro ? `<div class="nota">📍 Retirás en: ${esc(cfg.direccion_retiro)}</div>` : ""}
      ${pedido.entrega==="Envío" && (cfg.nota_envio || gratis) ? `<div class="nota">🚚 ${esc(cfg.nota_envio || "El envío tiene un costo a coordinar.")}${gratis ? ` <b>${c.total >= Number(cfg.envio_gratis_desde) ? "Tu pedido tiene envío gratis." : "Envío gratis desde " + fmt(cfg.envio_gratis_desde) + "."}</b>` : ""}</div>` : ""}
      <div class="error" id="eEntrega">Elegí cómo recibís el pedido.</div></div>
      <div class="campo"><label>Forma de pago *</label><div class="opciones">
        ${opcionesPago().map(o=>`<button type="button" class="opcion ${pedido.pago===o?"sel":""}" ${pagoPermitido(o)?"":"disabled"} onclick="pedido.pago=${esc(JSON.stringify(o))};renderPedido()">${o==="Efectivo"?"💵":o==="Transferencia"?"🏦":"💳"} ${esc(o)}${o==="Efectivo"&&Number(cfg.descuento_efectivo)>0?` (${Number(cfg.descuento_efectivo)}% off)`:""}</button>`).join("")}
      </div>
      ${cfg.envio_solo_transferencia && pedido.entrega==="Envío" ? `<div class="nota">🏦 Para pedidos con envío, el pago es por transferencia.</div>` : ""}
      <div class="error" id="ePago">Elegí una forma de pago.</div></div>
      <div class="campo"><label for="pObs">Comentarios (opcional)</label><textarea id="pObs" rows="2">${esc(datos.obs)}</textarea></div>
      <div class="error" id="eCarrito">Agregá al menos un producto.</div>
      <div class="error" id="eWa">Esta tienda todavía no tiene un WhatsApp configurado para recibir pedidos.</div>
      <button class="btn-enviar" onclick="enviarPedido()" ${skus.length?"":"disabled"}>📲 Enviar pedido por WhatsApp</button>`}`;
    renderBarra();
  }
  function marcar(id){ const e = document.getElementById(id); if(e) e.classList.add("show"); return false; }
  async function enviarPedido(){
    document.querySelectorAll("#panelPedido .error").forEach(e=>e.classList.remove("show"));
    const v = id => (document.getElementById(id)?.value || "").trim();
    const nombre = v("pNombre"), email = v("pEmail"), tel = v("pTel"), dir = v("pDir"), obs = v("pObs");
    let ok = true;
    if(!nombre) ok = marcar("eNombre");
    if(cfg.pide_email !== false && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) ok = marcar("eEmail");
    if(cfg.pide_telefono && numWa(tel).length < 6) ok = marcar("eTel");
    if(!pedido.entrega || (pedido.entrega==="Envío" && !dir)) ok = marcar("eEntrega");
    if(!pedido.pago || !pagoPermitido(pedido.pago)) ok = marcar("ePago");
    const skus = Object.keys(cart); if(!skus.length) ok = marcar("eCarrito");
    const wa = numWa(cfg.whatsapp); if(!wa) ok = marcar("eWa");
    if(!ok){ document.querySelector("#panelPedido .error.show")?.scrollIntoView({behavior:"smooth", block:"center"}); return; }
    const c = calcular();
    const items = skus.map(sku=>{ const p = productos.find(x=>x.sku===sku); return {sku, nombre:p.nombre, cantidad:cart[sku], precio:p.precio}; });
    const detalle = items.map(it=>`• ${it.nombre} (SKU ${it.sku})\n   Cant: ${it.cantidad} x ${fmt(it.precio)} = ${fmt(it.precio*it.cantidad)}`).join("\n");
    let envioTxt = "";
    if(pedido.entrega === "Envío" && Number(cfg.envio_gratis_desde) > 0)
      envioTxt = c.total >= Number(cfg.envio_gratis_desde) ? `\n\n🚚 Envío sin cargo (compra mayor a ${fmt(cfg.envio_gratis_desde)})` : `\n\n🚚 El envío tiene costo adicional (a coordinar).`;
    const msg =
`🛒 *NUEVO PEDIDO - ${String(tienda.nombre||"").toUpperCase()}*

*Cliente:* ${nombre}${email?`\n*Email:* ${email}`:""}${tel?`\n*Teléfono:* ${tel}`:""}
*Entrega:* ${pedido.entrega}${dir?`\n*Dirección:* ${dir}`:""}
*Forma de pago:* ${pedido.pago}

*Detalle del pedido:*
${detalle}

Subtotal: ${fmt(c.subtotal)}${c.desc?`\nDescuento efectivo (${Number(cfg.descuento_efectivo)}%): -${fmt(c.desc)}`:""}
*TOTAL: ${fmt(c.total)}*${envioTxt}${obs?`\n\n*Comentarios:* ${obs}`:""}`;
    const obsPedido = [email?"Email: "+email:"", "Entrega: "+pedido.entrega+(dir?" · "+dir:""), "Pago: "+pedido.pago, obs?"Comentarios: "+obs:""].filter(Boolean).join(" | ");
    if(!VISTA_PREVIA){
      try{
        const r = await sb("/rest/v1/pedidos", {method:"POST", headers:{"Prefer":"return=minimal"},
          body: JSON.stringify({fecha:new Date().toLocaleDateString("en-CA",{timeZone:"America/Argentina/Buenos_Aires"}), nombre, telefono:tel, observaciones:obsPedido, items, total:Math.round(c.total), estado:"pendiente", cliente_id:tienda.cliente_id})});
        if(!r.ok) console.error("No se pudo guardar el pedido:", await r.text());
      }catch(e){ console.error("No se pudo guardar el pedido:", e); }
    }
    window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`, "_blank");
    if(!VISTA_PREVIA){ cart = {}; guardarCarrito(); renderGrilla(); renderBarra(); }
    document.getElementById("panelPedido").innerHTML = `<button class="cerrar" onclick="cerrarCapa('capaPedido')">✕</button>
      <h2>✅ ¡Pedido enviado!</h2><p class="nota">Se abrió WhatsApp con el detalle. Si no se abrió, escribinos al ${esc(cfg.whatsapp)}.</p>`;
  }

  function pantallaMensaje(titulo, texto){
    document.getElementById("app").innerHTML = `<div class="pantalla-msg"><h1>${esc(titulo)}</h1><p>${esc(texto)}</p></div>`;
  }
  document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ cerrarCapa("capaFicha"); cerrarCapa("capaPedido"); } });

  // Vista previa en vivo: el panel manda la configuración sin guardar
  window.addEventListener("message", e=>{
    if(!VISTA_PREVIA || e.origin !== location.origin || !e.data || e.data.tipo !== "nexo-tienda-preview" || !tienda) return;
    const d = e.data.datos || {};
    if(d.config) cfg = combinar(configPorDefecto(tienda), d.config);
    if(typeof d.css === "string") tienda.css = d.css;
    if(typeof d.html_arriba === "string") tienda.html_arriba = d.html_arriba;
    if(typeof d.html_abajo === "string") tienda.html_abajo = d.html_abajo;
    aplicarEstetica(); render();
  });

  (async function iniciar(){
    try{
      tienda = await cargarTienda();
      if(!tienda || !tienda.cliente_id){
        pantallaMensaje("Tienda no disponible", SLUG ? "Esta tienda no existe o todavía no está publicada." : "Falta indicar qué tienda abrir.");
        return;
      }
      cfg = combinar(configPorDefecto(tienda), tienda.config);
      aplicarEstetica();
      await cargarProductos();
      leerCarrito();
      render();
      if(VISTA_PREVIA && window.parent !== window) window.parent.postMessage({tipo:"nexo-tienda-lista"}, location.origin);
    }catch(e){
      pantallaMensaje("No se pudo cargar la tienda", e.message);
    }
  })();
  </script>
</body>
</html>
